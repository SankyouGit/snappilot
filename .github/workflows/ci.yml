name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Run SnapCore logic tests
        run: swift run snapverify

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project Snappilot.xcodeproj -scheme Snappilot \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Check native annotation input and rendering
        run: |
          xcodebuild -project Snappilot.xcodeproj -scheme Snappilot \
            -configuration Debug -destination 'platform=macOS' \
            -resultBundlePath .build/AnnotationTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            test

      - name: Retain native test results and render attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annotation-test-results
          path: .build/AnnotationTests.xcresult
          if-no-files-found: ignore
          include-hidden-files: true
